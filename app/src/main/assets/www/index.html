<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>MyVloggingStudio</title>
<meta name="theme-color" content="#0d0f14">
<link rel="stylesheet" href="fonts.css">
<style>[hidden]{display:none!important}

/* Layout: phone editor — preview on top, transport, touch timeline with a fixed centre playhead, tool bar at the bottom; tool panels slide up as sheets. Deliberately dark-only, like the desktop app. */
:root{
  --bg:#0d0f14;--panel:#151820;--panel2:#1c2029;--panel3:#262b36;--line:#2c3140;
  --fg:#eceef3;--muted:#8d94a7;--accent:#f5b83d;--accent-ink:#1b1404;
  --vid:#2b767c;--txt:#dca13b;--aud:#7a6bcb;--danger:#e26169;
  --f-display:"Familjen Grotesk","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(150px,1fr) auto minmax(0,auto) auto;box-sizing:border-box;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-block:0}
.top{display:flex;align-items:center;gap:6px;padding:8px max(12px,env(safe-area-inset-left,0px)) 6px max(12px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap}
.brand svg{color:var(--accent)}
.spacer{flex:1}
.ib{width:40px;height:40px;border-radius:10px;border:0;background:none;display:grid;place-items:center;color:var(--fg)}
.ib:active{background:var(--panel3)}
.ib:disabled{opacity:.35}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-weight:600;white-space:nowrap}
.btn:active{background:var(--panel3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:#ffb3b8}
.btn.sm{min-height:34px;padding:0 11px;border-radius:9px;font-size:13px}
.btn:disabled{opacity:.4}

.stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;background:#07080b;overflow:hidden}
#cv{max-width:100%;max-height:100%;width:auto;height:auto;background:#000;touch-action:none;display:block}
.stage .hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(13,15,20,.82);border:1px solid var(--line);padding:6px 11px;border-radius:999px;font-size:12px;color:var(--fg);white-space:nowrap;pointer-events:none;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.transport{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
.tc{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tc b{color:var(--fg);font-weight:500}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.transport .r{justify-self:end;display:flex;gap:2px}

/* timeline */
.tl{position:relative;height:min(36vh,300px);background:var(--panel);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.app.big .tl{height:110px}
.app.sheeted{padding-bottom:var(--shH,0px)}
.app.sheeted .tools{display:none}
.app.sheeted .tl{height:92px}
#tlContent{position:absolute;left:0;top:0;will-change:transform}
.ruler{position:relative;height:22px}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--line)}
.tick span{position:absolute;left:3px;top:3px;font-family:var(--f-mono);font-size:9.5px;color:var(--muted)}
.tick.minor{height:5px;top:auto;bottom:0}
.row{position:relative;margin-bottom:4px}
.row.video{background:color-mix(in srgb,var(--vid) 7%,transparent)}
.row.video.main{background:color-mix(in srgb,var(--vid) 13%,transparent)}
.row.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.clip{position:absolute;top:0;bottom:0;box-sizing:border-box;border-radius:7px;overflow:hidden;border:2px solid transparent}
.clip.v{background-color:var(--vid);background-repeat:repeat-x;background-size:auto 100%}
.clip.t{background:var(--txt);color:#21160a;font-weight:700;font-size:11.5px}
.clip.a{background-color:var(--aud);background-repeat:no-repeat;background-size:100% 70%;background-position:center}
.clip.sel{border-color:#fff;z-index:2}
.clip.moving{opacity:.85;box-shadow:0 8px 18px rgba(0,0,0,.6);z-index:4}
.clip .cap{position:absolute;inset:auto 0 0 0;padding:2px 8px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;pointer-events:none}
.clip.t .cap{inset:0;display:flex;align-items:center;background:none;color:inherit}
.clip .bdg{position:absolute;top:2px;right:6px;font-family:var(--f-mono);font-size:9.5px;background:rgba(0,0,0,.6);color:#fff;padding:0 4px;border-radius:3px;pointer-events:none}
.clip .bdg.l{right:auto;left:6px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.clip .fade{position:absolute;top:0;bottom:0;pointer-events:none}
.clip .kf{position:absolute;bottom:3px;width:7px;height:7px;margin-left:-3.5px;background:#fff;transform:rotate(45deg);pointer-events:none}
.clip .kfbar{position:absolute;bottom:4px;height:5px;border-radius:3px;background:repeating-linear-gradient(90deg,#fff 0 3px,transparent 3px 6px);pointer-events:none}
.hdl{position:absolute;top:0;bottom:0;width:22px;background:#fff;z-index:3;display:grid;place-items:center}
.hdl::after{content:"";width:3px;height:40%;border-radius:2px;background:var(--bg)}
.hdl.l{border-radius:7px 0 0 7px}.hdl.r{border-radius:0 7px 7px 0}
#playhead{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;z-index:6;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#playhead::before{content:"";position:absolute;top:0;left:-6px;width:14px;height:10px;background:#fff;clip-path:polygon(0 0,100% 0,50% 100%)}
.lbls{position:absolute;left:0;top:0;width:28px;z-index:5;pointer-events:none}
.lbls div{position:absolute;left:0;width:28px;display:grid;place-items:center;color:var(--muted);background:linear-gradient(90deg,var(--panel) 60%,transparent)}
.empty{position:absolute;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--muted);white-space:nowrap;pointer-events:none}

/* tools */
.tools{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));background:var(--bg);border-top:1px solid var(--line);scrollbar-width:none;touch-action:pan-x}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;min-width:64px;height:58px;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--fg);font-size:11.5px;font-weight:600}
.tool svg{width:22px;height:22px}
.tool:active,.tool.on{background:var(--panel3)}
.tool.on{color:var(--accent)}
.tool.dot::after{content:"";position:absolute}
.tool.danger{color:#ffb3b8}
.tool .sep{display:none}
.toolsep{flex:none;width:1px;margin:10px 4px;background:var(--line)}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -12px 30px rgba(0,0,0,.5);
  max-height:min(48vh,460px);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(0);transition:transform .22s ease}
.sheet[hidden]{display:flex!important;transform:translateY(105%);pointer-events:none;visibility:hidden}
.sh-head{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px))}
.sh-head b{font-family:var(--f-display);font-size:17px;flex:1}
.sh-body{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-left,0px)) 16px max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;overscroll-behavior:contain}
.f{display:grid;gap:8px}
.f>span{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.f output{font-family:var(--f-mono);font-size:12px;color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
input[type=color]{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:3px}
select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;box-sizing:border-box}
textarea{min-height:76px;resize:vertical;line-height:1.4;font-size:16px}
.seg{display:flex;background:var(--panel2);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;min-height:38px;padding:0 6px;border-radius:8px;color:var(--muted);font-size:13px;font-weight:600;min-width:0}
.seg button.on{background:var(--panel3);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fx{background:none;border:0;padding:0;display:grid;gap:5px;font-size:11px;color:var(--muted);text-align:center}
.fx i{display:block;aspect-ratio:1;border-radius:9px;background-size:cover;background-position:center;border:2px solid transparent}
.fx i.eff{display:grid;place-items:center;background:var(--panel2);color:var(--fg)}
.fx.on{color:var(--fg)}.fx.on i{border-color:var(--accent)}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0}
.note{background:color-mix(in srgb,var(--accent) 12%,var(--panel2));border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.5}
.note.bad{background:color-mix(in srgb,var(--danger) 14%,var(--panel2));border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.big-actions{display:grid;gap:8px}
.tpresets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpreset{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 8px;font-size:21px;line-height:1.1;overflow:hidden;white-space:nowrap}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bsw{aspect-ratio:1;border-radius:10px;border:1px solid var(--line)}
.trk-list{display:grid;gap:6px}
.trk-item{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px}
.trk-item span{flex:1}
.bar{height:8px;background:var(--panel3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}

/* export + recover */
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,6,9,.78);display:flex;align-items:flex-end;justify-content:center}
.modal .card{background:var(--panel);width:min(560px,100%);max-height:100%;overflow:auto;border-radius:18px 18px 0 0;box-sizing:border-box;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.modal h2{margin:0;font-family:var(--f-display);font-size:20px}
.modal video{width:100%;max-height:44vh;border-radius:12px;background:#000}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
#toast{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line);padding:9px 14px;border-radius:12px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);font-size:13px;text-align:center}
#toast.show{opacity:1}
#pool{position:fixed;left:-9999px;top:0;width:2px;height:2px;overflow:hidden}
.empty-stage{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted);font-size:14px;line-height:1.5;pointer-events:none}
.empty-stage b{color:var(--fg);font-size:16px;display:block;margin-bottom:4px;font-family:var(--f-display)}

@media (orientation:landscape) and (max-height:520px){
  .app{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top top" "stage tl" "tr tools" "tr tools"}
  .top{grid-area:top;padding-block:4px}.stage{grid-area:stage}.transport{grid-area:tr}.tl{grid-area:tl;height:auto}.tools{grid-area:tools}
}
@media (prefers-reduced-motion:reduce){.sheet,.bar i,#toast{transition:none}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V4h4M17 4h4v4M3 16v4h4M21 16v4h-4"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor" stroke="none"/><circle cx="16.5" cy="7.5" r="1.4" fill="#ff4d4d" stroke="none"/></svg>MyVlogging<small style="font-weight:500;opacity:.7;margin-left:1px">Studio</small></div>
    <div class="spacer"></div>
    <button class="ib" id="undoBtn" aria-label="Deshacer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ib" id="redoBtn" aria-label="Rehacer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="btn primary sm" id="exportBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Exportar</button>
  </header>
  <section class="stage" id="stage">
    <canvas id="cv" width="960" height="540"></canvas>
    <div class="empty-stage" id="emptyStage"><div><b>Empezá tu video</b>Tocá <b style="display:inline;font-size:inherit;color:var(--accent)">Agregar</b> abajo para sumar videos y fotos de tu galería.</div></div>
    <div class="hint" id="stageHint" hidden></div>
  </section>
  <div class="transport">
    <span class="tc"><b id="tcNow">00:00</b> / <span id="tcTot">00:00</span></span>
    <button class="play" id="playBtn" aria-label="Reproducir"></button>
    <div class="r"><button class="ib" id="bigBtn" aria-label="Agrandar la vista previa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
  </div>
  <section class="tl" id="tl" aria-label="Línea de tiempo">
    <div id="tlContent"></div>
    <div class="lbls" id="lbls"></div>
    <div id="playhead"></div>
  </section>
  <nav class="tools" id="tools" aria-label="Herramientas"></nav>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-labelledby="shTitle">
  <div class="sh-head"><b id="shTitle"></b><button class="btn sm primary" id="shDone">Listo</button></div>
  <div class="sh-body" id="shBody"></div>
</div>
<div class="modal" id="expModal" hidden><div class="card" id="expCard"></div></div>
<div class="modal" id="recModal" hidden><div class="card" id="recCard"></div></div>
<input type="file" id="fileIn" multiple accept="video/*,image/*" hidden>
<input type="file" id="audIn" multiple accept="audio/*,video/*" hidden>
<input type="file" id="recIn" multiple accept="video/*,image/*,audio/*" hidden>
<div id="toast" role="status"></div>
<div id="pool" aria-hidden="true"></div>
<script src="lib/mp4box.all.min.js"></script>
<script src="lib/mp4-muxer.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const S={media:new Map(),proj:null,sel:null,time:0,playing:false,zoom:60,undo:[],redo:[],exporting:false,magnet:false,tool:null,inspTab:null,picking:false};
let n=0;const uid=p=>p+(++n).toString(36)+Math.random().toString(36).slice(2,6);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtTC(t){t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60),f=Math.floor((t%1)*30+1e-6);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`}
function fmtMS(t){t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function fmtShort(t){const m=Math.floor(t/60),s=t%60;return m+':'+(s<10?'0':'')+(Number.isInteger(s)?s:s.toFixed(1))}
const fmtSec=t=>(Math.round(t*10)/10).toFixed(1)+' s';
const fmtETA=s=>!isFinite(s)?'…':s<60?Math.ceil(s)+' s':Math.floor(s/60)+' min '+String(Math.round(s%60)).padStart(2,'0')+' s';
let SCALE=.5;const boxes=new Map(),expFrames=new Map();let layers=[],zDrag=null;
const curFocus=(c,lt)=>focusAt(c,lt);
let tt;function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),ms)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const TEXT_PRESETS=[
  {label:'Título',font:'Archivo Black',size:9,color:'#ffffff',bg:'#000000',style:'outline',anim:'pop',y:.5},
  {label:'Subtítulo',font:'Figtree',size:5,color:'#ffffff',bg:'#000000',style:'box',anim:'fade',y:.84},
  {label:'Neón',font:'Bebas Neue',size:12,color:'#9ff6ff',bg:'#19c6ff',style:'shadow',anim:'rise',y:.5},
  {label:'Manuscrito',font:'Caveat',size:10,color:'#ffe6a1',bg:'#000000',style:'shadow',anim:'type',y:.5},
  {label:'Clásico',font:'DM Serif Display',size:8,color:'#ffffff',bg:'#000000',style:'plain',anim:'fade',y:.5},
  {label:'Impacto',font:'Anton',size:13,color:'#f5b83d',bg:'#111111',style:'outline',anim:'pop',y:.5},
  {label:'Retro',font:'Pacifico',size:8,color:'#ff6fa8',bg:'#ffffff',style:'outline',anim:'rise',y:.5},
];
const ASPECTS={'16:9':[1920,1080],'9:16':[1080,1920],'3:4':[1080,1440],'1:1':[1080,1080],'4:5':[1080,1350]};
const sideways=c=>{const r=(((c.rot||0)%180)+180)%180;return r>45&&r<135};
const vdur=c=>(c.out-c.in)/c.speed;
const asp=c=>c.speed||1;
const adur=c=>(c.out-c.in)/asp(c);
const clipVol=c=>c.muted||c.detached?0:c.volume;
const trk=c=>c.track||0;
const V0=()=>S.proj.video.filter(c=>!c.track).sort((a,b)=>a.start-b.start);
const FONTS=['Archivo Black','Anton','Bebas Neue','Caveat','DM Serif Display','Figtree','Pacifico','Familjen Grotesk'];

function syncMedia(){
  const act=new Map();
  for(const v of videosAt(S.time)){const m=S.media.get(v.clip.mediaId);if(m&&m.kind==='video'){let f=1;const c=v.clip;if(c.aFadeIn>0)f=Math.min(f,v.lt/c.aFadeIn);if(c.aFadeOut>0)f=Math.min(f,(v.dur-v.lt)/c.aFadeOut);act.set(m.id,{local:v.local,rate:c.speed,vol:clipVol(c)*clamp(f,0,1)})}}
  for(const a of S.proj.audio){const lt=S.time-a.start,d=adur(a);if(lt>=0&&lt<d){let f=1;if(a.fadeIn>0)f=Math.min(f,lt/a.fadeIn);if(a.fadeOut>0)f=Math.min(f,(d-lt)/a.fadeOut);act.set(a.mediaId,{local:a.in+lt*asp(a),rate:asp(a),vol:(a.muted?0:a.volume)*clamp(f,0,1)})}}
  for(const m of S.media.values()){
    if(!m.el)continue;const el=m.el,a=act.get(m.id);
    if(!a){if(!el.paused)el.pause();continue}
    setVol(m,a.vol);
    if(S.playing){if(Math.abs(el.playbackRate-a.rate)>.001)el.playbackRate=clamp(a.rate,.0625,16);if(Math.abs(el.currentTime-a.local)>.3&&!el.seeking)el.currentTime=a.local;if(el.paused)el.play().catch(()=>{})}

  }
}

  const Z=S.zoom,T=total(),W=tl.clientWidth,span=Math.max(T,1)+2,full=PAD()*2+span*Z;
  const height=layoutRows();
  const sel=S.sel?.id;let h=`<div class="ruler" style="width:${full}px">`;
  const step=pickStep();for(let s=0;s<=span;s+=step){h+=`<div class="tick" style="left:${tX(s)}px"><span>${fmtShort(+s.toFixed(1))}</span></div>`;for(let k=1;k<4;k++){const ms=s+step*k/4;if(ms<=span)h+=`<div class="tick minor" style="left:${tX(ms)}px"></div>`}}
  h+='</div>';
  for(const r of rows){
    const items=S.proj[r.kind].filter(c=>trk(c)===r.idx);
    h+=`<div class="row ${r.kind}${r.kind==='video'&&r.idx===0?' main':''}" data-kind="${r.kind}" data-idx="${r.idx}" style="position:absolute;left:0;top:${r.y}px;height:${r.h}px;width:${full}px">`;
    for(const c of items)h+=clipHTML(r.kind,c,sel===c.id);
    if(!items.length){const msg=r.kind==='video'&&r.idx===0&&!S.proj.video.length?'Tus videos y fotos van acá':r.kind==='video'&&r.idx>0?'Mantené apretado un clip y arrastralo acá para ponerlo encima':r.kind==='text'&&!S.proj.text.length?'Textos':r.kind==='audio'&&!S.proj.audio.length?'Música y voz':'';if(msg)h+=`<div class="empty" style="left:${PAD()+12}px">${msg}</div>`}
    h+='</div>';
  }
  tlc.innerHTML=h;tlc.style.width=full+'px';tlc.style.height=height+'px';
  lbls.innerHTML=rows.map(r=>`<div style="top:${r.y}px;height:${r.h}px">${ICO[r.kind]}</div>`).join('');
  scrollY=clamp(scrollY,0,Math.max(0,height-tl.clientHeight+8));
  applyScroll();
}
function clipHTML(kind,c,sel){
  const Z=S.zoom;
  if(kind==='video'){const m=S.media.get(c.mediaId),w=vdur(c)*Z;
    const bg=m?.kind==='color'?`background:linear-gradient(135deg,${m.colors[0]},${m.colors[1]})`:(m?.thumb?`background-image:url(${m.thumb})`:'');
    const kf=c.zOn&&c.zKeys&&c.zKeys.length?(()=>{const pos=k=>(k.s-c.in)/c.speed,vis=c.zKeys.filter(k=>pos(k)>=0&&pos(k)<=vdur(c));if(!vis.length)return'';if(vis.length>30){const a=pos(vis[0]),b=pos(vis[vis.length-1]);return`<i class="kfbar" style="left:${a*Z}px;width:${Math.max(4,(b-a)*Z)}px"></i>`}return vis.map(k=>`<i class="kf" style="left:${pos(k)*Z}px"></i>`).join('')})():'';
    const tags=[c.zOn?'Zoom':'',c.marks?.length?'Marcador':'',c.fx&&c.fx!=='none'?EFFECTS[c.fx][0]:''].filter(Boolean).join(' + ');
    return`<div class="clip v${sel?' sel':''}" data-type="video" data-id="${c.id}" style="left:${tX(c.start)}px;width:${Math.max(6,w)}px;${bg}">`+
      (c.fadeIn?`<div class="fade" style="left:0;width:${c.fadeIn*Z}px;background:linear-gradient(90deg,rgba(0,0,0,.6),transparent)"></div>`:'')+(c.fadeOut?`<div class="fade" style="right:0;width:${c.fadeOut*Z}px;background:linear-gradient(-90deg,rgba(0,0,0,.6),transparent)"></div>`:'')+
      (tags?`<span class="bdg l">${tags}</span>`:'')+(c.speed!==1?`<span class="bdg">${+c.speed.toFixed(2)}x</span>`:'')+(m?.kind==='video'&&(c.detached||c.muted)?`<span class="bdg" style="top:auto;bottom:16px">${c.detached?'Audio aparte':'Mudo'}</span>`:'')+
      kf+`<div class="cap">${esc(m?.name||'Medio')}</div>${sel?'<div class="hdl l" data-side="l"></div><div class="hdl r" data-side="r"></div>':''}</div>`}
  if(kind==='text')return`<div class="clip t${sel?' sel':''}" data-type="text" data-id="${c.id}" style="left:${tX(c.start)}px;width:${Math.max(6,c.dur*Z)}px"><div class="cap">${esc(c.text.replace(/\n/g,' '))}</div>${sel?'<div class="hdl l" data-side="l"></div><div class="hdl r" data-side="r"></div>':''}</div>`;
  const m=S.media.get(c.mediaId),W=adur(c)*Z,full=(m?.duration||adur(c))/asp(c)*Z;
  const wave=m?.wave?`background-image:url(${m.wave});background-size:${full}px 70%;background-position:${-c.in/asp(c)*Z}px center;`:'';
  return`<div class="clip a${sel?' sel':''}" data-type="audio" data-id="${c.id}" style="left:${tX(c.start)}px;width:${Math.max(6,W)}px;${wave}">`+
    (c.fadeIn?`<div class="fade" style="left:0;width:${c.fadeIn*Z}px;background:linear-gradient(90deg,rgba(0,0,0,.6),transparent)"></div>`:'')+(c.fadeOut?`<div class="fade" style="right:0;width:${c.fadeOut*Z}px;background:linear-gradient(-90deg,rgba(0,0,0,.6),transparent)"></div>`:'')+
    (c.muted?'<span class="bdg">Mudo</span>':c.volume!==1?`<span class="bdg">${Math.round(c.volume*100)}%</span>`:'')+
    `<div class="cap">${esc(m?.name||'Audio')}</div>${sel?'<div class="hdl l" data-side="l"></div><div class="hdl r" data-side="r"></div>':''}</div>`;
}
function applyScroll(){tlc.style.transform=`translate(${-S.time*S.zoom}px,${-scrollY}px)`;lbls.style.transform=`translateY(${-scrollY}px)`}
const style=document.createElement('style');style.textContent='.clip.sel{overflow:visible}.hdl.l{left:-22px}.hdl.r{right:-22px}';document.head.appendChild(style);

/* touch: swipe = scroll, pinch = zoom, tap = select, long-press + drag = move clip, white handles = trim */
const ptrs=new Map();let G=null,inert=null;
function stopInertia(){inert=null}
function stepInertia(now){if(!inert)return;const dt=now-inert.t;inert.t=now;S.time=clamp(S.time-inert.v*dt/S.zoom,0,Math.max(0,total()));inert.v*=Math.pow(.94,dt/16);if(Math.abs(inert.v)<.02||S.time<=0||S.time>=total())inert=null;applyScroll()}
function rowAt(y){const r=tl.getBoundingClientRect(),yy=y-r.top+scrollY;return rows.find(o=>yy>=o.y-GAP/2&&yy<o.y+o.h+GAP/2)||null}
function neighbors(c,arr,type){const same=arr.filter(x=>x!==c&&trk(x)===trk(c)),e=x=>type==='video'?x.start+vdur(x):type==='text'?x.start+x.dur:x.start+adur(x);let pe=0,ns=Infinity;for(const x of same){if(x.start<=c.start+1e-6)pe=Math.max(pe,e(x));else ns=Math.min(ns,x.start)}return[pe,ns]}
function snapT(t,selfId,dur=0){const th=12/S.zoom,cands=[0,S.time];for(const k of['video','text','audio'])for(const c of S.proj[k])if(c.id!==selfId){const e=k==='video'?c.start+vdur(c):k==='text'?c.start+c.dur:c.start+adur(c);cands.push(c.start,e)}
  let best=t,bd=th;for(const c of cands){if(Math.abs(c-t)<bd){bd=Math.abs(c-t);best=c}if(dur&&Math.abs(c-(t+dur))<bd){bd=Math.abs(c-(t+dur));best=c-dur}}return best}
tl.addEventListener('pointerdown',e=>{
  if(S.exporting)return;try{tl.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){if(G&&G.lp)clearTimeout(G.lp);if(G&&(G.type==='move'||G.type==='trim'))return;const[a,b]=[...ptrs.values()];G={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:S.zoom};return}
  if(ptrs.size>2)return;
  stopInertia();if(S.playing)setPlaying(false);
  const hd=e.target.closest('.hdl'),ce=e.target.closest('.clip');
  if(hd&&ce){const type=ce.dataset.type,c=S.proj[type].find(x=>x.id===ce.dataset.id);if(c){G={type:'trim',side:hd.dataset.side,ctype:type,c,o:{...c},x0:e.clientX,prev:snap()};return}}

  if(ce)G.lp=setTimeout(()=>{if(G&&G.type==='pending'){const type=ce.dataset.type,c=S.proj[type].find(x=>x.id===ce.dataset.id);if(!c)return;if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}
    if(S.sel?.id!==c.id){S.sel={type,id:c.id};renderTools()}

tl.addEventListener('pointermove',e=>{

  if(G.type==='move'){

      else{const endT=clamp(snapT(o.start+vdur(o)+dt,c.id),o.start+.1,Math.min(ns,o.start+(maxOut-o.in)/o.speed));c.out=o.in+(endT-o.start)*o.speed}}

function endPtr(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(!G)return;
  if(G.type==='pinch'){if(ptrs.size<2)G=null;return}
  if(G.type==='pending'){clearTimeout(G.lp);const ce=G.ce;G=null;if(e.type==='pointercancel')return;
    if(ce){const type=ce.dataset.type,id=ce.dataset.id;if(S.sel?.id===id){/* tap again: keep */}else select(type,id)}else if(S.sel)select(null);return}
  if(G.type==='pan'){const s=G.samples;if(s.length>1){const[a,b]=[s[0],s[s.length-1]];const v=(b[1]-a[1])/Math.max(1,b[0]-a[0]);if(Math.abs(v)>.15)inert={v:v,t:performance.now()}}G=null;return}

tl.addEventListener('pointerup',endPtr);tl.addEventListener('pointercancel',endPtr);
tl.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey){S.zoom=clamp(S.zoom*(e.deltaY<0?1.1:1/1.1),6,400);renderTimeline()}else{seek(S.time+(e.deltaX||e.deltaY)/S.zoom)}},{passive:false});
new ResizeObserver(()=>renderTimeline()).observe(tl);

function renderTools(){
  const c=getSel(),t=S.sel?.type;let it;
  if(!c)it=[['add','Agregar'],['text','Texto'],['music','Audio'],['format','Formato'],['tracks','Pistas'],['project','Proyecto']];
  else if(t==='video'){const m=S.media.get(c.mediaId)||{},v=m.kind==='video';
    it=[['split','Dividir'],['adjust','Ajustes'],v?['speed','Velocidad']:['speed','Duración'],...(v?[['vol','Audio']]:[]),['zoom','Zoom'],['mark','Marcar'],['color','Color'],['fx','Efectos'],['fade','Fundidos'],['date','Fecha'],...(v?[['freeze','Congelar']]:[]),['dup','Duplicar'],['del','Eliminar']]}
  else if(t==='text')it=[['edit','Editar'],['style','Estilo'],['anim','Animación'],['split','Dividir'],['dup','Duplicar'],['del','Eliminar']];
  else it=[['vol','Volumen'],['speed','Velocidad'],['split','Dividir'],['dup','Duplicar'],['del','Eliminar']];
  $('#tools').innerHTML=it.map(([k,l])=>`<button class="tool${S.tool===k?' on':''}${k==='del'?' danger':''}" data-tool="${k}">${IC[k==='speed'&&l==='Duración'?'speed':k]||IC.add}<span>${l}</span></button>`).join('');
}
$('#tools').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;const k=b.dataset.tool;
  const actions={split,dup:duplicate,del,freeze:freezeFrame,add:()=>openSheet('add'),music:()=>$('#audIn').click()};
  if(actions[k]){actions[k]();return}
  if(S.tool===k)closeSheet();else openSheet(k);
});

const sheet=$('#sheet'),shBody=$('#shBody');
const TITLES={mark:'Marcar algo que se mueve',date:'Fecha y hora',add:'Agregar',text:'Agregar texto',format:'Formato',tracks:'Pistas',project:'Proyecto',adjust:'Ajustes',speed:'Velocidad',vol:'Audio',zoom:'Zoom',color:'Color',fx:'Efectos',fade:'Fundidos',edit:'Editar texto',style:'Estilo',anim:'Animación'};
function sheetLayout(){const app=$('#app');if(sheet.hidden){app.classList.remove('sheeted');app.style.removeProperty('--shH')}else{app.classList.add('sheeted');app.style.setProperty('--shH',sheet.offsetHeight+'px')}setTimeout(renderTimeline,30)}
new ResizeObserver(()=>{if(!sheet.hidden)$('#app').style.setProperty('--shH',sheet.offsetHeight+'px')}).observe(sheet);

  else if(S.tool==='mark'&&curMark(c))m='Tocá la imagen sobre lo que querés marcar';
  else if(S.tool==='adjust'&&c)m='Arrastrá para mover · dos dedos para agrandar y girar';
  else if(S.sel?.type==='text'&&(S.tool==='edit'||S.tool==='style'))m='Arrastrá el texto · dos dedos para agrandarlo';
  el.textContent=m;el.hidden=!m}

function fmtOut(v,f){return f==='f1'?(+v).toFixed(1):f==='deg'?Math.round(v)+'°':f==='pct'?Math.round(v*100)+'%':f==='x'?(+v).toFixed(2)+'x':f==='s'?(+v).toFixed(1)+' s':f==='int'?Math.round(v)+'':f==='sgn'?(v>0?'+':'')+Math.round(v):String(v)}

const horizontalClips=()=>S.proj.video.filter(c=>{const m=S.media.get(c.mediaId);return m&&m.w&&m.w>m.h&&c.fit==='contain'&&!sideways(c)});

function split(){
  const t=S.time,prev=snap();let c=getSel(),type=S.sel?.type,b=null;
  const inside=(type,c)=>{if(!c)return false;const s=c.start,e=type==='video'?s+vdur(c):type==='text'?s+c.dur:s+adur(c);return t>s+.04&&t<e-.04};
  if(!inside(type,c)){const v=topVideoAt(t);c=v?.clip;type='video';if(!inside(type,c)){toast('Poné el cabezal sobre un clip para dividirlo');return}}

  else if(type==='text'){b.start=c.start+c.dur;S.proj.text.push(b)}else{b.start=c.start+adur(c);S.proj.audio.push(b)}

  const prev=snap();const a={id:uid('a'),track:0,mediaId:am.id,start:c.start,in:c.in,out:c.out,speed:c.speed,volume:c.volume,muted:!!c.muted,fadeIn:c.aFadeIn||0,fadeOut:c.aFadeOut||0};

let freezing=false;

  const c=v.clip,m=S.media.get(c.mediaId);if(!m||m.kind!=='video'){toast('El congelado funciona con clips de video');return}

    const el=m.el;el.currentTime=v.local;await once(el,'seeked');await new Promise(r=>el.requestVideoFrameCallback?el.requestVideoFrameCallback(()=>r()):setTimeout(r,60));

    const blob=await new Promise(r=>k.toBlob(r,'image/jpeg',.95));const file=new File([blob],'Congelado '+fmtShort(+v.local.toFixed(1))+'.jpg',{type:'image/jpeg'});
    const im=await importFile(file,'image');im.name='Congelado · '+m.name;im.generated=true;S.media.set(im.id,im);await idbPut(im.id,blob);
    const prev=snap(),D=2,t=S.time,st=c.start,end=st+vdur(c);let insAt;

    for(const q of S.proj.video)if(q.start>=insAt-1e-6)q.start+=D;

    const extra=[];for(const a of S.proj.audio){if(a.start>=insAt-1e-6){a.start+=D;continue}const am=S.media.get(a.mediaId),ae=a.start+adur(a);
      if(am&&am.fromVideo&&am.file===m.file&&ae>insAt+.04){const lt=(insAt-a.start)*asp(a);extra.push({...a,id:uid('a'),start:insAt+D,in:a.in+lt,fadeIn:0});a.out=a.in+lt;a.fadeOut=0}}

    {const t0=stampTimeAt(c,m,v.local);if(t0!=null)f.stampBase=t0;f.frozen=1}
    if(c.zOn){const p0=zoomP(c,v.lt,v.dur);if(p0>.01){const fo=focusAt(c,v.lt);Object.assign(f,{zOn:1,zAmt:1+((c.zAmt??2)-1)*p0,zStart:-10,zRamp:.8,zBack:'no',zx:fo[0],zy:fo[1]})}}

}

async function mixAudio(T,onp){

  for(const a of S.proj.audio){const m=S.media.get(a.mediaId);if(m&&!a.muted&&a.volume>0)segs.push({m,in:a.in,out:a.out,speed:asp(a),start:a.start,vol:a.volume,fi:a.fadeIn||0,fo:a.fadeOut||0})}

    try{buf=await audioRange(s.m,s.in,s.out,off)}catch(e){console.warn(e);toast('No se pudo leer el sonido de “'+s.m.name+'”. Sigo sin ese audio.',4000)}
    if(!buf)continue;any=true;const src=off.createBufferSource();src.buffer=buf;src.playbackRate.value=s.speed;const g=off.createGain();src.connect(g);g.connect(off.destination);

}
async function runExport(){
  const[w,h]=expDims(),fps=EX.fps,N=Math.max(1,Math.round(total()*fps)),T=N/fps,bitrate=expBitrate(w,h);
  card.innerHTML=`<h2>Exportando…</h2><div class="bar"><i id="xBar"></i></div><p class="tc" id="xTxt">Preparando…</p><p class="hint">Dejá la pantalla prendida y esta pestaña abierta.</p><div class="btns"><button class="btn" data-x="cancel">Cancelar</button></div>`;
  const bar=$('#xBar'),txt=$('#xTxt');EX.cancel=false;let wake=null;try{wake=await navigator.wakeLock.request('screen')}catch(e){}
  const ve=await pickVideoEncoder(w,h,fps,bitrate);
  if(!ve){finishFail('El teléfono no puede codificar video en '+w+' × '+h+'. Probá con una resolución más baja.');return}
  const ae=await pickAudioEncoder();
  const target=blobTarget();
  txt.textContent='Mezclando el sonido…';
  let mix=null;try{mix=ae?await mixAudio(T,p=>{txt.textContent='Mezclando el sonido… '+Math.round(p*100)+'%'}):null}catch(e){console.error(e)}
  const muxer=new Mp4Muxer.Muxer({target,fastStart:false,firstTimestampBehavior:'offset',video:{codec:ve.kind,width:w,height:h,frameRate:fps},...(mix?{audio:{codec:ae.kind,numberOfChannels:2,sampleRate:48000}}:{})});
  let fail=null;
  if(mix){const enc=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>{fail=e}});enc.configure(ae.cfg);
    const L=mix.getChannelData(0),R=mix.getChannelData(1),B=48000;for(let i=0;i<mix.length;i+=B){const n=Math.min(B,mix.length-i),d=new Float32Array(n*2);d.set(L.subarray(i,i+n),0);d.set(R.subarray(i,i+n),n);
      const ad=new AudioData({format:'f32-planar',sampleRate:48000,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(i/48*1000),data:d});enc.encode(ad);ad.close();while(enc.encodeQueueSize>8)await sleep(2)}
    await enc.flush();enc.close()}
  let yuv=null;try{yuv=makeYUV(w,h);if(yuv&&!yuv.selfTest())yuv=null}catch(e){console.warn(e);yuv=null}
  const venc=new VideoEncoder({output:(c,m)=>{if(yuv&&m&&m.decoderConfig)m.decoderConfig.colorSpace=BT709;muxer.addVideoChunk(c,m)},error:e=>{fail=e}});venc.configure(ve.cfg);
  S.exporting=true;S.sel=null;cv.width=w;cv.height=h;SCALE=w/ASPECTS[S.proj.aspect][0];
  const readers=new Map(),t0=performance.now();
  try{
    for(let i=0;i<N;i++){
      if(EX.cancel||fail)break;
      S.time=i/fps;const vis=videosAt(S.time),act=new Set();
      for(const v of vis){const m=S.media.get(v.clip.mediaId);if(!m||m.kind!=='video')continue;const id=v.clip.id;act.add(id);
        let rd=readers.get(id);if(!rd){rd=new VReader(m);readers.set(id,rd);await rd.init(v.local)}
        const f=await rd.frameAt(v.local);if(f)expFrames.set(id,f);else expFrames.delete(id)}
      for(const[id,rd]of readers)if(!act.has(id)){rd.close();readers.delete(id);expFrames.delete(id)}
      render();
      const ts=Math.round(i*1e6/fps),du=Math.round(1e6/fps),vf=yuv?yuv.frame(cv,ts,du):new VideoFrame(cv,{timestamp:ts,duration:du});venc.encode(vf,{keyFrame:i%(fps*2)===0});vf.close();
      while(venc.encodeQueueSize>2)await sleep(1);
      if(i%3===0||i===N-1){const el=(performance.now()-t0)/1000,rate=(i+1)/el;bar.style.width=((i+1)/N*100).toFixed(1)+'%';txt.textContent=`Cuadro ${i+1} de ${N} · ${rate.toFixed(1)} cuadros/s · quedan ~${fmtETA((N-i-1)/rate)}`}
    }
    if(!EX.cancel&&!fail){txt.textContent='Terminando el archivo…';await venc.flush()}
  }catch(e){console.error(e);fail=e}
  for(const rd of readers.values())rd.close();expFrames.clear();try{venc.state!=='closed'&&venc.close()}catch(e){}
  S.exporting=false;SCALE=.5;applyAspect();try{wake&&wake.release()}catch(e){}
  if(EX.cancel){modal.hidden=true;toast('Exportación cancelada');return}
  if(fail){finishFail(String(fail.message||fail));return}
  muxer.finalize();const blob=await target.toBlob('video/mp4');EX.blob=blob;
  const secs=(performance.now()-t0)/1000,mbps=blob.size*8/T/1e6,mb=blob.size/1048576;
  EX.name=(S.projName||'mi-video').replace(/[\\/:*?"<>|]/g,'')+'.mp4';
  card.innerHTML=`<h2>¡Listo!</h2><video controls playsinline src="${URL.createObjectURL(blob)}"></video><p class="hint">${QLBL[EX.q]} (${w} × ${h}) · ${fps} fps · ${Math.round(mbps)} Mbps · ${mb>=1024?(mb/1024).toFixed(2)+' GB':Math.round(mb)+' MB'} · ${fmtETA(secs)} de exportación${mix?'':' · sin sonido'}</p><p class="hint" id="xMsg"></p><div class="btns"><button class="btn" data-x="close">Cerrar</button><button class="btn primary" data-x="save">Guardar en el teléfono</button></div>`;
}
function finishFail(msg){card.innerHTML=`<h2>No se pudo exportar</h2><div class="note bad">${esc(msg)}</div><div class="btns"><button class="btn" data-x="close">Cerrar</button></div>`;S.exporting=false;SCALE=.5;applyAspect()}
// inside the Android app: stream the video to the phone's gallery in pieces
async function saveAndroid(blob,msg){
  const A=window.MVSAndroid,id=A.begin(EX.name,blob.type||'video/mp4');if(!id)throw new Error('No se pudo crear el archivo');
  const CH=3*1024*1024;
  for(let o=0;o<blob.size;o+=CH){
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).slice(String(r.result).indexOf(',')+1));r.onerror=()=>rej(r.error);r.readAsDataURL(blob.slice(o,o+CH))});
    if(!A.chunk(id,b64)){A.abort(id);throw new Error('No se pudo escribir el archivo')}
    msg.textContent='Guardando… '+Math.min(100,Math.round((o+CH)/blob.size*100))+'%';
  }
  const where=A.end(id);if(!where)throw new Error('No se pudo terminar de guardar');return where;
}
async function saveExport(btn){
  const msg=$('#xMsg'),blob=EX.blob;if(!blob)return;btn.disabled=true;
  if(window.MVSAndroid){try{const w=await saveAndroid(blob,msg);msg.textContent='Guardado en '+w+'. Lo ves en tu galería.'}catch(err){msg.textContent=String(err.message||err)}btn.disabled=false;return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=EX.name;document.body.appendChild(a);a.click();a.remove();msg.textContent='Si no se descargó, mantené apretado el video de arriba y elegí “Descargar”.';btn.disabled=false;
}

/* ---------- automatic tracking (same tracker as the desktop app) ---------- */
let track=null;
async function trackForward(target){
  const isMark=target==='mark',c=getSel();if(!c||S.sel.type!=='video'||(!isMark&&!c.zOn))return;const m=S.media.get(c.mediaId);const mk=isMark?curMark(c):null;if(isMark&&!track&&(!mk||!mk.keys.length)){toast('Primero tocá la imagen sobre lo que querés marcar');return}
  if(!m||m.kind!=='video'){toast('El seguimiento funciona con clips de video');return}
  if(track){track.cancel=true;return}
  if(!('VideoDecoder' in window)){toast('Este navegador no permite el seguimiento. Usá Chrome actualizado.');return}
  setPlaying(false);
  let v=infoAt(c,S.time);if(!v){seek(c.start+Math.min(isMark?0:(c.zStart||0),vdur(c)-.05));v=infoAt(c,S.time)}
  const lt0=v.lt,dur=vdur(c);if(dur-lt0<.2){toast('Mové el cabezal a donde empieza el movimiento');return}
  let u,vv;if(isMark)[u,vv]=keyAtSrc(mk.keys,c.in+lt0*c.speed);else{const f=focusAt(c,lt0);[u,vv]=c2s(c,f[0],f[1])}
  const FPS=20,GW=480,GH=Math.max(2,Math.round(GW*(m.h||9)/(m.w||16)/2)*2);
  const bx=srcBox(c),zA=c.zAmt??2,visW=GW*Math.min(1,1/(bx.rx*zA)),visH=GH*Math.min(1,1/(bx.ry*zA));
  const half=isMark?clamp(Math.round(Math.min(mk.w*GW,mk.h*GH,.2*GW,.16*GH)*.4),10,40):clamp(Math.round(Math.min(visW,visH)*.16),10,40),R=Math.max(18,Math.round(half*1.5));
  if(u*GW<half||u*GW>GW-half-1||vv*GH<half||vv*GH>GH-half-1){toast('Lo que querés seguir está muy pegado al borde. Movelo un poco hacia adentro.');return}

  const rd=new VReader(m),gc=document.createElement('canvas');gc.width=GW;gc.height=GH;const gx=gc.getContext('2d',{willReadFrequently:true});
  const tr=makeTracker(GW,GH,half,3),img=new Uint8Array(GW*GH*3);
  let px=u*GW,py=vv*GH,vx=0,vy=0,n=0,lost=false,bad=0,init=false;const pts=[];const N=Math.max(1,Math.floor((dur-lt0)*FPS));

/* ---------- autosave + recover after Chrome closes the tab ---------- */
let idb=null;
function idbOpen(){if(idb)return idb;idb=new Promise((res,rej)=>{try{const r=indexedDB.open('tijera-movil',1);r.onupgradeneeded=()=>r.result.createObjectStore('blobs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return idb}
async function idbPut(k,v){try{const db=await idbOpen();await new Promise((res,rej)=>{const t=db.transaction('blobs','readwrite');t.objectStore('blobs').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
async function idbGet(k){try{const db=await idbOpen();return await new Promise((res,rej)=>{const t=db.transaction('blobs').objectStore('blobs').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}catch(e){return null}}
let asT=0;
function autosave(){clearTimeout(asT);asT=setTimeout(()=>{try{
  const used=new Set([...S.proj.video,...S.proj.audio].map(c=>c.mediaId)),media=[];
  for(const m of S.media.values()){if(!used.has(m.id))continue;media.push({id:m.id,kind:m.kind,name:m.file?m.file.name:m.name,label:m.name,size:m.file?m.file.size:0,colors:m.colors,bgIndex:m.bgIndex,generated:!!m.generated,fromVideo:!!m.fromVideo})}
  localStorage.setItem('tijera-movil-proj',JSON.stringify({v:1,proj:S.proj,media,saved:Date.now()}))}catch(e){}},600)}
async function recover(){
  let d=null;try{d=JSON.parse(localStorage.getItem('tijera-movil-proj')||'null')}catch(e){}
  if(!d||!d.proj||!(d.proj.video.length||d.proj.text.length||d.proj.audio.length))return;
  const need=d.media.filter(x=>x.kind!=='color'&&!x.generated);
  const rc=$('#recCard'),rm=$('#recModal');
  const restore=async files=>{
    S.proj=d.proj;migrateStarts();const missing=[];
    for(const x of d.media){
      if(x.kind==='color'){bgMedia(x.bgIndex??0,x.id);continue}
      if(x.generated){const b=await idbGet(x.id);if(b){const m=await importFile(new File([b],x.name||'congelado.jpg',{type:b.type||'image/jpeg'}),'image',x.id);m.name=x.label||m.name;m.generated=true;S.media.set(x.id,m)}else missing.push(x.label);continue}
      const f=files.find(f=>f.name===x.name&&f.size===x.size)||files.find(f=>f.name===x.name);
      if(!f){missing.push(x.name);continue}
      try{const m=await importFile(f,x.kind==='audio'?'audio':null,x.id);if(x.fromVideo){m.fromVideo=true;m.name=x.label||m.name}S.media.set(x.id,m)}catch(e){missing.push(x.name)}
    }
    applyAspect();S.undo=[];S.redo=[];updUndo();seek(0);refreshAll();rm.hidden=true;
    toast(missing.length?'Faltan estos archivos: '+missing.join(', '):'Proyecto recuperado',5000);
  };
  rc.innerHTML=`<h2>Seguí donde lo dejaste</h2><p class="hint">Tenés un proyecto sin terminar (${fmtMS(Math.max(0,...d.proj.video.map(c=>c.start+vdur(c)),...d.proj.text.map(x=>x.start+x.dur)))}). Para abrirlo, elegí de nuevo estos archivos de tu galería:</p><div class="trk-list">${need.map(x=>`<div class="trk-item"><span>${esc(x.name)}</span></div>`).join('')||'<p class="hint">No hace falta elegir nada.</p>'}</div><div class="btns"><button class="btn danger" data-r="new">Empezar de cero</button><button class="btn primary" data-r="pick">${need.length?'Elegir archivos':'Abrir proyecto'}</button></div>`;
  rm.hidden=false;
  rc.onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;
    if(b.dataset.r==='new'){try{localStorage.removeItem('tijera-movil-proj')}catch(_){}rm.hidden=true;return}
    if(!need.length){restore([]);return}
    const inp=$('#recIn');inp.onchange=()=>{const fs=[...inp.files];inp.value='';if(fs.length){rc.innerHTML='<h2>Abriendo…</h2><p class="hint">Cargando tus archivos.</p>';restore(fs)}};inp.click()};
