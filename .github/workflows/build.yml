name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle --no-daemon assembleRelease

      - name: Preparar el APK
        run: cp app/build/outputs/apk/release/app-release.apk MyVloggingStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyVloggingStudio-apk
          path: MyVloggingStudio.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima MyVloggingStudio.apk --target "${{ github.sha }}" \
            --title "MyVloggingStudio (última versión)" \
            --notes "Compilado automáticamente. Desde el celular, tocá MyVloggingStudio.apk para bajarlo e instalarlo."
